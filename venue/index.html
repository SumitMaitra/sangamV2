<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venue &amp; How to Reach | SANGAM 2027</title>
  <meta name="description" content="Directions to NIT Durgapur, the venue of SANGAM 2027.">
  <link rel="icon" type="image/png" href="../assets/logos/nit-durgapur.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <script src="../js/layout.js" data-root="../" data-page="venue"></script>

  <!-- ===== PAGE BANNER ===== -->
  <section class="page-banner" style="background-image:url('../assets/photos/dsc_8276.jpg')">
    <div class="container">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="../">Home</a><span>/</span><span>Venue</span></nav>
      <h1>Venue</h1>
      <p>National Institute of Technology Durgapur, Mahatma Gandhi Avenue, Durgapur, West Bengal</p>
    </div>
  </section>

  <!-- ===== VENUE / HOW TO REACH ===== -->
  <section class="section venue" id="venue">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">Plan Your Visit</span>
        <h2>How to Reach NIT Durgapur</h2>
        <p class="lead">Scan these, To Reach NIT Durgapur.</p>
      </div>
      <div class="venue-grid">
        <div class="qr-cards">
          <div class="qr-card reveal">
            <div class="qr-ico">✈</div>
            <img src="../assets/qr/airport-andal.png" alt="QR code for directions from Andal airport to NIT Durgapur" loading="lazy">
            <h4>Andal to NIT Durgapur</h4>
          </div>
          <div class="qr-card reveal">
            <div class="qr-ico">🚆</div>
            <img src="../assets/qr/railway-station.png" alt="QR code for directions from Durgapur railway station to NIT Durgapur" loading="lazy">
            <h4>Station to NIT Durgapur</h4>
          </div>
          <div class="qr-card reveal">
            <div class="qr-ico">🚌</div>
            <img src="../assets/qr/bus-stand.png" alt="QR code for directions from the bus stand to NIT Durgapur" loading="lazy">
            <h4>Bus Stand to NIT Durgapur</h4>
          </div>
        </div>
        <div class="map reveal">
          <iframe title="Map of NIT Durgapur" src="https://maps.google.com/maps?q=National%20Institute%20of%20Technology%20Durgapur&t=&z=14&ie=UTF8&iwloc=&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
    </div>
  </section>

  <script>SiteLayout.footer()</script>

  <script src="../js/main.js"></script>

</body>
</html>
